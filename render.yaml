# Asterfall — cinematic spaceflight and precision landing.
# Existing manually created services retain their dashboard name and URL.
services:
  - type: web
    name: asterfall
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/docker/Dockerfile
    dockerContext: .
    dockerCommand: node /app/game/server.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
